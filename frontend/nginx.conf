# ---------------------------------------------------------------------------
# Servidor estatico del frontend + proxy inverso hacia el backend.
#
# El navegador solo conoce este origen (http://localhost:3000). Las llamadas
# a /analyze y /health salen relativas al mismo origen y nginx las reenvia al
# contenedor `backend` por la red interna de Docker, que si resuelve ese
# hostname. De este modo no hay peticiones cross-origin desde el navegador.
# ---------------------------------------------------------------------------

# Host del backend dentro de la red de Compose.
upstream backend_api {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Aplicacion de pagina unica: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre pueden cachearse de forma agresiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API de analisis. El analisis con IA puede tardar decenas de segundos.
    location /analyze/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Healthcheck del backend accesible desde el mismo origen que la interfaz.
    location = /health {
        proxy_pass http://backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

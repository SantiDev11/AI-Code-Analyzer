# ---------------------------------------------------------------------------
# AI-Code-Analyzer — entorno local completo en un solo servicio unificado.
#
#   docker compose up --build     Construye y levanta la aplicacion completa
#   docker compose down           Detiene y elimina el contenedor
#
# Arquitectura unificada:
#
#   Navegador -> http://localhost:8000 (FastAPI sirviendo React + API)
#                     ├── GET /                   -> Frontend React (SPA)
#                     ├── GET /assets/...         -> CSS / JS de Vite
#                     ├── GET /health             -> Healthcheck
#                     ├── GET /docs               -> Swagger UI
#                     └── GET /analyze/{owner}/{repo} -> Analisis con IA
#
# Los secretos se leen del archivo .env de la raiz (ignorado por git) y se
# inyectan como variables de entorno al contenedor. Nunca se copian a la imagen.
# ---------------------------------------------------------------------------
name: ai-code-analyzer

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-code-analyzer:local
    environment:
      # Credenciales privadas: solo viven dentro del backend
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AI_API_KEY: ${AI_API_KEY:-}
      # Configuracion de IA y cache
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30.0}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      ACTIVITY_DAYS: ${ACTIVITY_DAYS:-30}
      # Origenes permitidos por CORS para desarrollo local desacoplado
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped


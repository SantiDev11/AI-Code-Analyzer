# ---------------------------------------------------------------------------
# Integracion continua de AI-Code-Analyzer.
#
# Tres jobs: `backend` y `frontend` corren en paralelo y `docker` solo arranca
# si ambos han pasado, para no gastar minutos construyendo imagenes de un
# commit que ya sabemos roto.
#
# La CI no necesita ningun secreto: los tests sustituyen el cliente HTTP por
# uno simulado (tests/conftest.py), asi que no se llama a la GitHub API ni a
# ningun proveedor de IA. Por eso GITHUB_TOKEN y AI_API_KEY no aparecen aqui.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos minimos: los jobs solo leen el codigo, no escriben nada en el repo.
permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela la ejecucion anterior en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 3.12 es la version que usa la imagen de produccion (Dockerfile).
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements-dev.txt incluye requirements.txt y anade pytest.
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar tests
        run: pytest

  frontend:
    name: Frontend (vitest, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 22 es la version que usa la etapa de build de frontend/Dockerfile.
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` instala exactamente lo fijado en package-lock.json.
      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

      - name: Comprobacion de tipos
        run: npm run typecheck

      - name: Build de produccion
        run: npm run build

  docker:
    name: Docker (compose build)
    runs-on: ubuntu-latest
    # Solo se construyen imagenes si el codigo ya ha pasado sus pruebas.
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Falla pronto si compose.yaml tiene errores de sintaxis o referencias.
      - name: Validar compose.yaml
        run: docker compose config

      # No se publica ninguna imagen: solo se comprueba que ambas compilan.
      - name: Construir imagenes
        run: docker compose build
